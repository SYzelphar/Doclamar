[project]
name = "doclamar"
version = "0.1.0"
description = "doclamar using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=1.1.1",
    "crewai[tools]>=0.177.0,<1.0.0",
    "google-genai>=1.60.0",
    "google-generativeai>=0.8.6",
    "pydantic>=2.12.5",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.2.1",
]

[project.scripts]
doclamar = "doclamar.main:run"
run_crew = "doclamar.main:run"
train = "doclamar.main:train"
replay = "doclamar.main:replay"
test = "doclamar.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
